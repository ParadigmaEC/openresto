volumes:
  media_data:
  pg_data:

services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=openresto
      - POSTGRES_PASSWORD=openresto
      - POSTGRES_DB=openresto
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openresto -d openresto"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./OpenRestoApi
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - PORT=8080
      - CORS_ORIGINS=http://localhost:5062
      - CONNECTION_STRING=Host=postgres;Port=5432;Database=openresto;Username=openresto;Password=openresto;Maximum Pool Size=10
      # Development reads appsettings.Development.json, whose localhost connection string wins
      # over CONNECTION_STRING; this key overrides it.
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=openresto;Username=openresto;Password=openresto;Maximum Pool Size=10
    env_file:
      - ./OpenRestoApi/.env.docker
    volumes:
      - media_data:/app/wwwroot/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./openresto-frontend
      dockerfile: Dockerfile
      args:
        - EXPO_PUBLIC_API_URL=/api
    environment:
      - EXPO_PUBLIC_API_URL=/api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/"]
      interval: 5s
      timeout: 5s
      retries: 10

  reverse-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "5062:80"
    environment:
      - PORT=80
      - BACKEND_HOST=backend
      - BACKEND_PORT=8080
      - FRONTEND_HOST=frontend
      - FRONTEND_PORT=8081
    volumes:
      - media_data:/usr/share/nginx/html/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
