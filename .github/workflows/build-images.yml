name: Build images

# Builds and pushes every OpenResto image to GHCR. This repository only produces images;
# deploying them is the infrastructure repository's job, which pulls a pinned tag.
#
# Called from two places, and the caller's ref decides the tags:
#   - release.yml on a vX.Y.Z tag  -> X.Y.Z, X.Y, latest
#   - ci.yml on a push to main      -> main, sha-<short>
on:
  workflow_call:

jobs:
  build:
    name: Build ${{ matrix.image }} (multi-arch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: ./OpenRestoApi
            build-args: ""
          - image: frontend
            context: ./openresto-frontend
            # Relative on purpose: nginx routes /api, so one image serves every environment.
            build-args: EXPO_PUBLIC_API_URL=/api
          - image: nginx
            context: ./nginx
            build-args: ""
          - image: cli
            context: ./openresto-cli
            build-args: ""
    steps:
      - uses: actions/checkout@v7

      # GHCR rejects upper case, and the owner here is "ParadigmaEC".
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openresto-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
