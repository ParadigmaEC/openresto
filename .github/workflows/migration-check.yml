name: Migration Safety Check

on:
  pull_request:
    branches: [main]
    paths:
      - "OpenRestoApi/Migrations/**.cs"
      - "OpenRestoApi/Infrastructure/Persistence/AppDbContext.cs"
  push:
    branches: [main]
    paths:
      - "OpenRestoApi/Migrations/**.cs"
      - "OpenRestoApi/Infrastructure/Persistence/AppDbContext.cs"

permissions:
  contents: read

jobs:
  migration-check:
    name: EF Core Migration Safety
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Needed if EF design-time tooling invokes the app host
      ADMIN_PASSWORD: ci-migration-check-password
      JWT_KEY: ci-migration-check-jwt-key-must-be-32-chars-long
      CONNECTION_STRING: "Host=localhost;Port=5432;Database=ef_tools;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install EF Core CLI tools
        run: dotnet tool install --global dotnet-ef --version '10.0.*'

      - name: Restore and build
        working-directory: OpenRestoApi
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore

      - name: Detect new migration files
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            # For a push to main, compare against the commit before this push
            BASE="${{ github.event.before }}"
          fi

          # Added *or* modified. Editing an existing migration is legitimate while it is
          # unreleased (fixing one before anyone has applied it), and that edit needs checking
          # more than most — it is the case where the migration has already been proven wrong.
          NEW_FILES=$(git diff "$BASE"...HEAD --name-status -- 'OpenRestoApi/Migrations/*.cs' \
            | grep -E "^(A|M)" \
            | grep -v "Designer\.cs\|Snapshot\." \
            | awk '{print $2}' \
            | sort)

          if [ -z "$NEW_FILES" ]; then
            echo "No added or modified migration files — skipping upgrade-path test."
            echo "has_new_migrations=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Added/modified migration files:"
          echo "$NEW_FILES"
          echo "has_new_migrations=true" >> $GITHUB_OUTPUT

          # Sort by filename (migration IDs are datetime-prefixed, so sort == chronological order)
          FIRST_NEW=$(echo "$NEW_FILES" | head -1 | xargs basename | sed 's/\.cs$//')
          echo "first_new_migration=$FIRST_NEW" >> $GITHUB_OUTPUT

          # Find the migration that immediately precedes the first new one
          ALL_MIGRATIONS=$(ls OpenRestoApi/Migrations/*.cs 2>/dev/null \
            | grep -v "Designer\.cs\|Snapshot\." \
            | sort \
            | xargs -I{} basename {} .cs \
            | sort)

          BASELINE=$(echo "$ALL_MIGRATIONS" | grep -B1 "^${FIRST_NEW}$" | head -1)

          # If the first new migration IS the oldest migration, there is no baseline
          if [ "$BASELINE" = "$FIRST_NEW" ]; then
            BASELINE=""
          fi

          echo "baseline_migration=$BASELINE" >> $GITHUB_OUTPUT
          echo "Baseline migration: ${BASELINE:-(empty — first migration ever)}"

      - name: Generate full migration SQL
        if: steps.detect.outputs.has_new_migrations == 'true'
        working-directory: OpenRestoApi
        run: |
          dotnet ef migrations script \
            --configuration Release --no-build \
            --output /tmp/all-migrations.sql
          echo "=== Full migration SQL preview (first 40 lines) ==="
          head -40 /tmp/all-migrations.sql

      - name: Generate baseline SQL (schema before new migrations)
        if: >
          steps.detect.outputs.has_new_migrations == 'true' &&
          steps.detect.outputs.baseline_migration != ''
        working-directory: OpenRestoApi
        run: |
          BASELINE="${{ steps.detect.outputs.baseline_migration }}"
          dotnet ef migrations script "0" "$BASELINE" \
            --configuration Release --no-build \
            --output /tmp/baseline-migrations.sql
          echo "=== Baseline SQL preview (first 40 lines) ==="
          head -40 /tmp/baseline-migrations.sql

      - name: Generate upgrade-only SQL (new migrations only)
        if: >
          steps.detect.outputs.has_new_migrations == 'true' &&
          steps.detect.outputs.baseline_migration != ''
        working-directory: OpenRestoApi
        run: |
          BASELINE="${{ steps.detect.outputs.baseline_migration }}"
          dotnet ef migrations script "$BASELINE" \
            --configuration Release --no-build \
            --output /tmp/upgrade-only.sql
          echo "=== Upgrade SQL preview (first 40 lines) ==="
          head -40 /tmp/upgrade-only.sql

      - name: Create databases
        if: steps.detect.outputs.has_new_migrations == 'true'
        run: |
          # psql/pg_dump run inside the service container so the client matches the server
          # version; the runner's own pg_dump refuses a newer server. The job context is not
          # available in the job-level env, so the id is exported from here.
          PG_CONTAINER="${{ job.services.postgres.id }}"
          echo "PG_CONTAINER=$PG_CONTAINER" >> "$GITHUB_ENV"
          for db in fresh upgrade; do
            docker exec "$PG_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE $db;"
          done

      - name: Test fresh install (all migrations on empty DB)
        if: steps.detect.outputs.has_new_migrations == 'true'
        run: |
          PSQL="docker exec -i $PG_CONTAINER psql -U postgres -X -v ON_ERROR_STOP=1"
          $PSQL -q -d fresh < /tmp/all-migrations.sql
          echo "=== Fresh install: tables ==="
          $PSQL -d fresh -c '\dt'
          echo "=== Fresh install: migration history ==="
          $PSQL -d fresh -c 'SELECT "MigrationId" FROM "__EFMigrationsHistory" ORDER BY 1;'

      - name: Test upgrade path (baseline → new migrations, against data)
        if: >
          steps.detect.outputs.has_new_migrations == 'true' &&
          steps.detect.outputs.baseline_migration != ''
        run: |
          PSQL="docker exec -i $PG_CONTAINER psql -U postgres -X -v ON_ERROR_STOP=1"

          # Create a database representing an existing install at the baseline version
          $PSQL -q -d upgrade < /tmp/baseline-migrations.sql
          echo "=== Pre-upgrade: migration history ==="
          $PSQL -d upgrade -c 'SELECT "MigrationId" FROM "__EFMigrationsHistory" ORDER BY 1;'

          # A real install has rows, and some statements PostgreSQL accepts against an empty
          # table it rejects against a populated one — ADD COLUMN ... NOT NULL without a
          # default being the usual one. Without this the job only proves the two paths agree
          # on schema, never that a migration can run at all.
          echo "=== Seeding fixture rows ==="
          PSQL="docker exec -i $PG_CONTAINER psql -U postgres" python3 scripts/fill-schema-fixture.py upgrade

          TABLES_SQL="SELECT tablename FROM pg_tables WHERE schemaname = 'public' AND tablename <> '__EFMigrationsHistory' ORDER BY 1;"
          $PSQL -At -d upgrade -c "$TABLES_SQL" > /tmp/pre-upgrade-tables.txt
          while read -r t; do
            printf '%s\t%s\n' "$t" "$($PSQL -At -d upgrade -c "SELECT COUNT(*) FROM \"$t\";")"
          done < /tmp/pre-upgrade-tables.txt > /tmp/pre-upgrade-counts.txt

          # Apply only the new migrations (simulates an in-place upgrade)
          $PSQL -q -d upgrade < /tmp/upgrade-only.sql
          echo "=== Post-upgrade: migration history ==="
          $PSQL -d upgrade -c 'SELECT "MigrationId" FROM "__EFMigrationsHistory" ORDER BY 1;'

          # A migration may legitimately rebuild a table, but it must carry the rows across.
          # Dropping them is silent data loss on every install, and the schema diff below
          # cannot see it.
          echo "=== Row counts: before → after ==="
          LOST=0
          while IFS=$'\t' read -r t before; do
            after="$($PSQL -At -d upgrade -c "SELECT COUNT(*) FROM \"$t\";" 2>/dev/null || echo MISSING)"
            echo "  $t: $before → $after"
            if [ "$after" = "MISSING" ]; then
              # A dropped table is fine if the migration meant it; flag it rather than fail.
              echo "    NOTE: table no longer exists after upgrade"
            elif [ "$after" -lt "$before" ]; then
              echo "    ROW LOSS: $t went from $before to $after"
              LOST=1
            fi
          done < /tmp/pre-upgrade-counts.txt

          if [ "$LOST" -ne 0 ]; then
            echo ""
            echo "DATA LOSS DETECTED — a migration dropped rows it should have preserved."
            exit 1
          fi

      - name: Compare schemas — fresh install vs upgrade path
        if: >
          steps.detect.outputs.has_new_migrations == 'true' &&
          steps.detect.outputs.baseline_migration != ''
        run: |
          # Comments and pg_dump's per-run \restrict token differ by design; the history
          # table's rows are not in a schema-only dump at all.
          dump_schema() {
            docker exec "$PG_CONTAINER" pg_dump -U postgres --schema-only --no-owner --no-privileges -d "$1" \
              | grep -v -e '^--' -e '^\restrict' -e '^\unrestrict' | sed '/^$/d'
          }
          dump_schema fresh > /tmp/fresh-schema.txt
          dump_schema upgrade > /tmp/upgraded-schema.txt

          if diff -u /tmp/fresh-schema.txt /tmp/upgraded-schema.txt; then
            echo ""
            echo "Schema check passed: fresh install and upgrade produce identical schemas."
          else
            echo ""
            echo "SCHEMA MISMATCH DETECTED"
            echo "The schema after a fresh install differs from the schema after upgrading."
            echo "This usually means a migration's Up() doesn't exactly replicate the model"
            echo "snapshot (e.g. a column/index/constraint is missing or extra on one path)."
            echo "Fix the migration before merging — existing installs will be affected."
            exit 1
          fi
