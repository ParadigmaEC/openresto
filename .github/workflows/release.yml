name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify version fields match the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check package versions and CHANGELOG against the tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/check-release-version.sh "$RELEASE_TAG"

  images:
    name: Build and push images
    needs: [verify-version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes for this version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NUM="${VERSION#v}"
          awk "/^## \[$VERSION_NUM\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md \
            > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG entry found for $VERSION_NUM — using full CHANGELOG." >&2
            cp CHANGELOG.md /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          gh release create "$VERSION" \
            --title "OpenResto $VERSION" \
            --notes-file /tmp/release-notes.md
